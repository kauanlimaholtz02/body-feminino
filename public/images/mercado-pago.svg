<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 50" fill="none" className="h-8 sm:h-9 w-auto">
  <!-- Handshake Oval Badge matching user screenshot -->
  <g transform="translate(3, 4)">
    <!-- Light Blue bottom fill -->
    <ellipse cx="28" cy="21" rx="26" ry="18" fill="#009EE3"/>
    
    <!-- White upper fill -->
    <path d="M 3,21 C 3,11 14.2,3 28,3 C 41.8,3 53,11 53,21 C 46,20 37,18.5 28,18.5 C 19,18.5 10,20 3,21 Z" fill="#FFFFFF"/>
    
    <!-- Hands & Arms -->
    <g fill="#FFFFFF" stroke="#002D52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left arm coming down -->
      <path d="M 7,12 L 18,17 L 27,15 L 23,11 L 11,7 Z" />
      
      <!-- Right arm coming down -->
      <path d="M 49,12 L 38,17 L 30,15 L 34,11 L 45,7 Z" />

      <!-- Center Clasp Handshake -->
      <path d="M 18,17 C 22,20 26,19 30,16 C 34,18.5 38,17.5 38,17 L 35,21.5 C 32,24 28,24 24,22 L 18,17 Z" />
      
      <!-- Knuckles / Interlocking fingers -->
      <path d="M 21,20 C 22,23 25,24.5 28,23.5" fill="none" stroke-width="2" />
      <path d="M 24,22 C 25,25 28,26.5 31,25" fill="none" stroke-width="2" />
      <path d="M 27,24 C 28.5,27 31.5,27.5 34,26" fill="none" stroke-width="2" />
    </g>

    <!-- Oval Outer Border -->
    <ellipse cx="28" cy="21" rx="26" ry="18" fill="none" stroke="#002D52" stroke-width="3"/>
  </g>

  <!-- Typography "mercado pago" -->
  <g fill="#002D52">
    <text x="66" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="900" letter-spacing="-0.6px">mercado</text>
    <text x="66" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="900" letter-spacing="-0.6px">pago</text>
  </g>
</svg>
