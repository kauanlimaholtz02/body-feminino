<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="truckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadowTruck" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Rounded Card -->
  <rect width="160" height="160" rx="32" fill="url(#truckBg)" filter="url(#shadowTruck)" />
  <rect x="4" y="4" width="152" height="152" rx="28" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.15" />

  <!-- Delivery Van / Truck Graphic -->
  <g transform="translate(24, 28)">
    <!-- Cargo Body -->
    <rect x="10" y="18" width="58" height="42" rx="4" fill="#FFFFFF" />
    <path d="M22 28 H38 V36 H22 Z" fill="#E2E8F0" />
    <!-- Cab -->
    <path d="M68 28 H86 L98 44 V60 H68 Z" fill="#FFFFFF" />
    <!-- Cab Window -->
    <path d="M72 32 H84 L92 44 H72 Z" fill="url(#accentBlue)" />
    <!-- Speed Lines -->
    <line x1="0" y1="28" x2="6" y2="28" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-3" y1="36" x2="5" y2="36" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="44" x2="7" y2="44" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Wheels -->
    <circle cx="30" cy="62" r="10" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="30" cy="62" r="4" fill="#38BDF8" />
    <circle cx="84" cy="62" r="10" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="84" cy="62" r="4" fill="#38BDF8" />
  </g>

  <!-- Text Label -->
  <g transform="translate(80, 114)">
    <text text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" letter-spacing="1">LOGÍSTICA</text>
  </g>

  <!-- Standard Delivery Tag -->
  <g transform="translate(38, 126)">
    <rect width="84" height="18" rx="9" fill="url(#accentBlue)" />
    <text x="42" y="13" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" letter-spacing="0.5">ENVIO PADRÃO</text>
  </g>
</svg>
